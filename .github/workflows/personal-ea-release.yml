name: SlipNet EA Personal Release

on:
  workflow_dispatch:
    inputs:
      baseline_version_code:
        description: Highest Personal EA versionCode already released
        required: true
        type: string
      rollback_data_policy:
        description: Android rollback data policy (0, 1, or 2)
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  qualify-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: jetbrains

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Configure Android local.properties
        env:
          CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'CONFIG_ENCRYPTION_KEY=%s\n' "$CONFIG_ENCRYPTION_KEY" >> local.properties

      - name: Build unsigned Personal EA candidate
        run: |
          tools/android/build_personal_release_candidate.sh | tee /tmp/slipnet-ea-unsigned.txt
          candidate_path="$(sed -n 's/.*;path=//p' /tmp/slipnet-ea-unsigned.txt | tail -1)"
          test -n "$candidate_path"
          test -f "$candidate_path"
          printf 'SLIPNET_RELEASE_UNSIGNED_APK=%s\n' "$candidate_path" >> "$GITHUB_ENV"

      - name: Qualify signing gate with ephemeral key
        run: tools/android/release_signing_gate_test.sh

      - name: Require production signer secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SLIPNET_EA_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SLIPNET_EA_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SLIPNET_EA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SLIPNET_EA_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.SLIPNET_EA_CERT_SHA256 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$CERT_SHA256"

      - name: Decode production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SLIPNET_EA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/slipnet-ea-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/slipnet-ea-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/slipnet-ea-signing/release.jks"

      - name: Sign and verify Personal EA
        env:
          SLIPNET_RELEASE_KEYSTORE: ${{ runner.temp }}/slipnet-ea-signing/release.jks
          SLIPNET_RELEASE_KEY_ALIAS: ${{ secrets.SLIPNET_EA_KEY_ALIAS }}
          SLIPNET_RELEASE_STORE_PASSWORD: ${{ secrets.SLIPNET_EA_STORE_PASSWORD }}
          SLIPNET_RELEASE_KEY_PASSWORD: ${{ secrets.SLIPNET_EA_KEY_PASSWORD }}
          SLIPNET_RELEASE_CERT_SHA256: ${{ secrets.SLIPNET_EA_CERT_SHA256 }}
          SLIPNET_BASELINE_VERSION_CODE: ${{ inputs.baseline_version_code }}
          SLIPNET_ROLLBACK_DATA_POLICY: ${{ inputs.rollback_data_policy }}
          SLIPNET_RELEASE_UNSIGNED_APK: ${{ env.SLIPNET_RELEASE_UNSIGNED_APK }}
          SLIPNET_RELEASE_OUTPUT_APK: .local/release/SlipNet-EA-personal-release.apk
        run: tools/android/release_signing_gate.sh

      - name: Upload qualified Personal EA artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipnet-ea-personal-qualified
          path: .local/release/SlipNet-EA-personal-release.apk
          if-no-files-found: error
          retention-days: 5

      - name: Remove production keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/slipnet-ea-signing"
